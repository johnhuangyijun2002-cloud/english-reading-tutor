<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="app.title">英语阅读学习器</title>
<link rel="stylesheet" href="style.css" />
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div id="topbar">
    <div class="topbar-brand">Reader<span id="usageBadge" class="usageBadge"></span></div>
    <div class="topbar-actions">
      <button id="btnAddArticle" class="btn btn-ghost" data-i18n="topbar.addArticle">添加文章</button>
      <label for="fileInput" class="btn btn-ghost" data-i18n="topbar.upload">上传文件</label>
      <input type="file" id="fileInput" accept=".pdf,.docx" class="visually-hidden" />
      <select id="docSelect" class="doc-select"></select>
      <div class="readerSettingsWrap">
        <button id="btnReaderSettings" class="btn btn-ghost readerSettingsBtn hidden">Aa</button>
        <div id="readerSettingsPanel" class="hidden">
          <div class="settingsRow">
            <span class="settingsLabel" data-i18n="readerSettings.fontSize">字号</span>
            <div class="settingsOptions" data-setting="fontSize">
              <button data-value="15" data-i18n="readerSettings.small">小</button>
              <button data-value="17" data-i18n="readerSettings.medium">中</button>
              <button data-value="19" data-i18n="readerSettings.large">大</button>
              <button data-value="22" data-i18n="readerSettings.xlarge">特大</button>
            </div>
          </div>
          <div class="settingsRow">
            <span class="settingsLabel" data-i18n="readerSettings.width">宽度</span>
            <div class="settingsOptions" data-setting="maxWidth">
              <button data-value="560" data-i18n="readerSettings.narrow">窄</button>
              <button data-value="700" data-i18n="readerSettings.mediumWidth">中</button>
              <button data-value="860" data-i18n="readerSettings.wide">宽</button>
            </div>
          </div>
          <div class="settingsRow">
            <span class="settingsLabel" data-i18n="readerSettings.font">字体</span>
            <div class="settingsOptions" data-setting="fontFamily">
              <button data-value="sans" data-i18n="readerSettings.sans">无衬线</button>
              <button data-value="serif" data-i18n="readerSettings.serif">衬线</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="recommendPanelOverlay" class="hidden">
    <div id="recommendPanel">
      <div class="recommendHeader">
        <h2 data-i18n="recommend.title">今日推荐</h2>
        <button id="btnRecommendRefresh" class="btn btn-ghost btn-small" data-i18n="recommend.refresh">换一批</button>
      </div>
      <div id="recommendList"></div>
      <div class="pasteActions">
        <button id="btnRecommendClose" class="btn btn-ghost" data-i18n="common.close">关闭</button>
      </div>
    </div>
  </div>

  <div id="pastePanelOverlay" class="hidden">
    <div id="pastePanel">
      <div class="pasteTabs">
        <button class="pasteTab active" data-tab="paste" data-i18n="paste.tabPaste">粘贴文本</button>
        <button class="pasteTab" data-tab="url" data-i18n="paste.tabUrl">网址导入</button>
      </div>

      <div class="pasteTabContent" data-tab-content="paste">
        <input type="text" id="pasteTitle" data-i18n-placeholder="paste.titlePlaceholder" placeholder="文章标题 / 来源（例如：纽约时报-2026年7月）" />
        <textarea id="pasteContent" data-i18n-placeholder="paste.contentPlaceholder" placeholder="把文章粘贴到这里..."></textarea>
      </div>

      <div class="pasteTabContent hidden" data-tab-content="url">
        <input type="text" id="urlInput" data-i18n-placeholder="paste.urlPlaceholder" placeholder="https://www.bbc.com/news/... 或 theguardian.com 的文章链接" />
        <p class="urlHint" data-i18n="paste.urlHint">支持 BBC、The Guardian 等新闻网站，会自动提取正文，跳过导航栏和广告</p>
      </div>

      <div class="settingsRow pasteLanguageRow">
        <span class="settingsLabel" data-i18n="paste.learningLanguage">正在学习的语言</span>
        <select id="learningLanguageSelect" class="doc-select"></select>
      </div>

      <div class="pasteActions">
        <button id="btnPasteCancel" class="btn btn-ghost" data-i18n="common.cancel">取消</button>
        <button id="btnPasteSubmit" class="btn btn-primary" data-i18n="paste.submit">开始阅读</button>
      </div>
    </div>
  </div>

  <div id="searchPanelOverlay" class="hidden">
    <div id="searchPanel">
      <h2 data-i18n="topbar.vocab">生词本</h2>
      <input type="text" id="searchInput" data-i18n-placeholder="search.placeholder" placeholder="搜索单词、释义、例句、来源文章...（留空显示全部）" />
      <div id="searchResults"></div>
      <div class="pasteActions">
        <button id="btnSearchClose" class="btn btn-ghost" data-i18n="common.close">关闭</button>
      </div>
    </div>
  </div>

  <div id="accountSettingsPanelOverlay" class="hidden">
    <div id="accountSettingsPanel">
      <h2 data-i18n="nav.settings">设置</h2>
      <p id="settingsUserLine" class="settingsUserLine"></p>

      <div class="settingsBlock">
        <span class="settingsBlockLabel" data-i18n="settings.uiLanguage">界面语言</span>
        <select id="uiLanguageSelect" class="settingsSelect">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="settingsBlock">
        <span class="settingsBlockLabel" data-i18n="settings.explainLanguage">AI 讲解语言</span>
        <select id="explainLanguageSelect" class="settingsSelect">
          <option value="auto" data-i18n="settings.explainFollowUI">跟随界面语言</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="settingsBlock">
        <span class="settingsBlockLabel" data-i18n="settings.aiProvider">AI 服务商</span>
        <select id="aiProviderSelect" class="settingsSelect"></select>
      </div>

      <div class="settingsBlock">
        <span class="settingsBlockLabel" data-i18n="settings.apiKey">API Key</span>
        <input type="password" id="aiApiKeyInput" data-i18n-placeholder="settings.apiKeyPlaceholder" placeholder="填入这个服务商的 API Key" />
        <p id="aiKeyHint" class="urlHint"></p>
        <p id="houseTrialHint" class="urlHint hidden"></p>
      </div>

      <div id="sheetsSyncBlock" class="settingsBlock settingsBlockRow hidden">
        <span class="settingsBlockLabel" data-i18n="settings.sheetsSync">同步到 Google Sheet</span>
        <input type="checkbox" id="sheetsSyncToggle" />
      </div>

      <div class="settingsBlock">
        <span class="settingsBlockLabel" data-i18n="settings.changeUsername">修改用户名</span>
        <input type="text" id="newUsernameInput" data-i18n-placeholder="settings.newUsernamePlaceholder" placeholder="填新用户名" />
        <div class="pasteActions">
          <button id="btnChangeUsername" class="btn btn-ghost btn-small" data-i18n="common.confirm">确认修改</button>
        </div>
        <p id="changeUsernameStatus" class="urlHint"></p>
      </div>

      <div class="settingsBlock">
        <span id="changePasswordLabel" class="settingsBlockLabel" data-i18n="settings.changePassword">修改密码</span>
        <input type="password" id="newPasswordInput" data-i18n-placeholder="settings.newPasswordPlaceholder" placeholder="填新密码，至少 8 位" />
        <div class="pasteActions">
          <button id="btnChangePassword" class="btn btn-ghost btn-small" data-i18n="common.confirm">确认修改</button>
        </div>
        <p id="changePasswordStatus" class="urlHint"></p>
      </div>

      <div class="settingsBlock">
        <span class="settingsBlockLabel" data-i18n="settings.googleLink">Google 账号关联</span>
        <p id="googleLinkStatus" class="urlHint"></p>
        <div class="pasteActions">
          <button id="btnLinkGoogle" class="btn btn-ghost btn-small" data-i18n="settings.googleLinkBtn">关联 Google 账号</button>
        </div>
      </div>

      <div class="pasteActions">
        <button id="btnLogout" class="btn btn-ghost" data-i18n="settings.logout">退出登录</button>
        <button id="btnSettingsSave" class="btn btn-primary" data-i18n="common.save">保存</button>
      </div>
      <p id="settingsSaveStatus" class="urlHint"></p>

      <div id="inviteBlock" class="settingsBlock inviteBlock hidden">
        <span class="settingsBlockLabel" data-i18n="settings.registeredUsers">已注册用户</span>
        <div id="invitedUsersList" class="invitedUsersList"></div>
      </div>

      <div class="settingsBlock settingsDangerZone">
        <span class="settingsBlockLabel" data-i18n="settings.accountData">账号数据</span>
        <div class="pasteActions">
          <button id="btnExportData" class="btn btn-ghost btn-small" data-i18n="settings.exportData">导出我的数据</button>
          <button id="btnDeleteAccount" class="btn btn-danger btn-small" data-i18n="settings.deleteAccount">删除账号</button>
        </div>
        <p id="accountDataStatus" class="urlHint"></p>
      </div>
    </div>
  </div>

  <div id="welcomeModalOverlay" class="hidden">
    <div id="welcomePanel">
      <h2 data-i18n="welcome.title">欢迎，账号已经注册好了 🎉</h2>
      <p id="welcomeBody" class="urlHint"></p>
      <p id="welcomeHouseTrialLine" class="urlHint hidden"></p>
      <div class="pasteActions">
        <button id="btnWelcomeClose" class="btn btn-primary" data-i18n="welcome.gotIt">知道了</button>
      </div>
    </div>
  </div>

  <div id="loginOverlay" class="hidden">
    <div id="loginPanel">
      <h2 id="loginPanelTitle" data-i18n="login.title">登录</h2>
      <p class="urlHint" data-i18n="login.hint">用户名随便填，密码至少 8 位；第一个注册的账号会自动成为主账号</p>
      <input type="text" id="loginUsernameInput" data-i18n-placeholder="login.username" placeholder="用户名" autocomplete="username" />
      <input type="password" id="loginPasswordInput" data-i18n-placeholder="login.password" placeholder="密码" autocomplete="current-password" />
      <p id="loginError" class="loginError hidden"></p>
      <div id="turnstileWidget" class="cf-turnstile" data-sitekey=""></div>
      <div class="pasteActions">
        <button id="btnRegisterSubmit" class="btn btn-ghost" data-i18n="login.registerBtn">注册新账号</button>
        <button id="btnLoginSubmit" class="btn btn-primary" data-i18n="login.loginBtn">登录</button>
      </div>
      <div class="loginDivider"><span data-i18n="login.or">或</span></div>
      <button id="btnGoogleLogin" class="btn btn-ghost loginGoogleBtn" data-i18n="login.googleLogin">用 Google 登录</button>
      <p class="loginLegalLinks">
        <span data-i18n="login.legalPrefix">继续即表示你同意</span><a href="/terms.html" target="_blank" data-i18n="login.terms">服务条款</a><span data-i18n="login.and">和</span><a href="/privacy.html" target="_blank" data-i18n="login.privacy">隐私政策</a>
      </p>
    </div>
  </div>

  <div id="main">
    <nav id="sideNav">
      <button class="navItem active" id="navReader">
        <span class="navIcon">📖</span>
        <span class="navLabel" data-i18n="nav.reader">阅读</span>
      </button>
      <button class="navItem" id="btnSearchHistory">
        <span class="navIcon">📚</span>
        <span class="navLabel" data-i18n="nav.vocab">生词本</span>
      </button>
      <button class="navItem" id="btnRecommend">
        <span class="navIcon">✨</span>
        <span class="navLabel" data-i18n="nav.recommend">AI 推荐</span>
      </button>
      <button class="navItem" id="btnAccountSettings">
        <span class="navIcon">⚙️</span>
        <span class="navLabel" data-i18n="nav.settings">设置</span>
      </button>
      <div class="navDivider"></div>
      <button class="navItem navItem-disabled" disabled title="更多功能开发中">
        <span class="navIcon">🧩</span>
        <span class="navLabel" data-i18n="nav.comingSoon">敬请期待</span>
      </button>
    </nav>
    <div id="viewer">
      <div id="readingProgress"><div id="readingProgressFill"></div></div>
      <div id="viewerContent">
        <div id="emptyState">
          <p data-i18n="empty.noDocument">粘贴一篇文章，或者上传 PDF / DOCX 文件，开始精读</p>
        </div>
      </div>
    </div>
    <div id="sidebar">
      <div class="sidebarHeader">
        <h2 data-i18n="sidebar.history">历史记录</h2>
        <div class="sidebarHeaderActions">
          <button id="btnSaveAll" class="btn btn-ghost btn-small" data-i18n="sidebar.saveAll" title="把当前还没存的解析结果一次性全部存进去">一键保存</button>
          <button id="btnPrint" class="btn btn-ghost btn-small hidden" data-i18n="sidebar.print" title="把文章和划过的生词/句子打印出来">🖨️ 打印</button>
        </div>
      </div>
      <div id="annotationList"></div>
    </div>
  </div>

  <div id="selectionToolbar" class="hidden">
    <button id="btnAnalyze"></button>
  </div>

  <div id="wordPopup" class="hidden"></div>

  <div id="printArea"></div>

  <script src="app.js"></script>
</body>
</html>
